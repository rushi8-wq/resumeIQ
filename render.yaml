services:
  - type: web
    name: resumeiq-api
    runtime: node
    buildCommand: npm ci --workspace=@resumeiq/server
    startCommand: npm start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
